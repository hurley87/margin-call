# Margin Call contract workspace.
#
# Retained reproducible baseline for the future Crash contract implementation.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Never let the toolchain pick a compiler for us.
auto_detect_solc = false
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# 1_000_000 stays under Blockscout/Etherscan's ~10M recompile ceiling while
# matching LazerForge's guidance that bytecode is typically flat past ~1M runs.
optimizer_runs = 1_000_000

# Keep metadata out of the bytecode so builds are reproducible.
bytecode_hash = "none"
cbor_metadata = false

# Local development is fast; CI runs the larger campaigns.
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }

# Deploy scripts write recorded addresses under deployments/.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Complete non-fork suite.
[profile.ci]
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 32 }

# Higher-run fuzz and invariant campaign.
[profile.ci-fuzz]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64 }

# Gas analysis and snapshots.
[profile.gas]
via_ir = true
optimizer_runs = 1_000_000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
